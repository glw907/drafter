# The stock defaults, applied as the first layer under the user config. Each seat uses the
# model, effort, and token ceilings measured on the cairn docs.

[gate]
command = "drafter gate --page {page}"

[prices]
date = "2026-10-18"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
batch_discount = 0.5

[prices.models.claude-opus-5-5]
input = 4.0
output = 20.0
cache_write_5m = 5.0
cache_write_1h = 8.0
cache_read = 0.20

[seat.draft]
model = "claude-opus-5-5"
effort = "high"
max_tokens = 128000

[seat.structure]
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000

[seat.editor]
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000

[seat.fact]
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000

[seat.reader]
model = "claude-opus-5-5"
effort = "low"
max_tokens = 32000

[seat.coverage]
model = "claude-opus-5-5"
effort = "low"
max_tokens = 32000

[seat.consistency]
model = "claude-opus-5-5"
