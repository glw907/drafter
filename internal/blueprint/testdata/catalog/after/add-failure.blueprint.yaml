version: 1
argument: |
  Rotating the widget key takes four steps, and the old key keeps working until the reader deletes it.
introduction:
  covers: |
    How to rotate the widget key without a gap in service.
  priorKnowledge: |
    The reader runs a deployed widget service and has admin access.
  notCovered: |
    Creating the first key.
  facts: [f:aaaaaa]
framing:
  readers: |
    An operator who rotates keys on a schedule. The page leans on `f:aaaaaa` for the two-key model.
  background: |
    Keys are long-lived, and the service accepts any key it holds.
  introPlan: |
    Open on the task and say what the page covers.
orderReason: |
  The page runs in the order a reader acts: prepare, rotate, then verify.
preconditions: [service-access]
exemplars:
  - source: guides/rotate-a-secret/
    slice: Guides
    manifestType: Task guide
    take: |
      Take the verify step that ends on a visible success signal.
sections:
  - id: before-you-begin
    heading: Before you begin
    why: |
      The reader needs the admin role before the first step.
    opens: |
      You need the admin role on the widget service.
    items:
      - id: needs-admin
        kind: fact
        fact: f:bbbbbb
        use: |
          Only the role requirement.
  - id: rotate
    heading: Rotate the key
    why: |
      Rotation is the page's job, so it comes right after the prerequisites.
    opens: |
      Generate a new key, then add it to the service.
    items:
      - id: s-generate
        kind: step
        text: |
          Generate a new key in the service settings.
        requires: [service-access]
        produces: [new-key]
        canFail: true
      - id: x-generate
        kind: failure
        from: s-generate
        symptom: |
          The settings page refuses to generate a key.
        handledBy: h-ask-admin
      - id: h-ask-admin
        kind: handoff
        text: |
          Ask an admin to grant the role, then try again.
      - id: c-two-keys
        kind: sentence
        mode: claim
        text: |
          The service accepts either key until you delete one.
        facts: [f:aaaaaa]
      - id: code-add
        kind: code
        text: |
          The command that adds the new key.
      - id: l-docs
        kind: link
        target: https://example.com/docs/keys
        text: widget key reference
  - id: verify
    heading: Verify the new key
    why: |
      A reader checks the result before deleting anything.
    opens: |
      Confirm that the service signs with the new key.
    items:
      - id: s-verify
        kind: step
        text: |
          Call the signing check and read the response.
        requires: [new-key]
        canFail: true
      - id: x-verify
        kind: failure
        from: s-verify
        symptom: |
          The check reports the old key's id.
        handledBy: h-retry-verify
      - id: h-retry-verify
        kind: handoff
        text: |
          Add the new key again and repeat the check.
      - id: r-verify
        kind: reason
        text: |
          The check proves the key works before the old one goes.
        facts: [f:cccccc]
dispositions:
  - fact: f:dddddd
    disposition: cut
    reason: |
      The page leaves key sizes to the reference.
